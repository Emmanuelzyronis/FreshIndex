name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/replication-consumer/requirements.txt -r services/indexer/requirements.txt -r services/staleness-monitor/requirements.txt
      - run: python -m compileall -q services load-generator tests
      - run: python -m unittest tests.unit.test_event_pipeline -v
