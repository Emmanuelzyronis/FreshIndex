name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check services load-generator tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/replication-consumer/requirements.txt -r services/indexer/requirements.txt -r services/staleness-monitor/requirements.txt -r requirements-dev.txt
      # Check packaged services via pyproject.toml (services/indexer + services/shared).
      - run: mypy --config-file pyproject.toml
      # Check services whose parent directories have hyphens (not valid Python package
      # names) individually so mypy does not collide on duplicate "main" module names.
      - run: mypy --ignore-missing-imports --check-untyped-defs services/replication-consumer/reader.py
      - run: mypy --ignore-missing-imports --check-untyped-defs services/staleness-monitor/main.py
      - run: mypy --ignore-missing-imports --check-untyped-defs load-generator/main.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/replication-consumer/requirements.txt -r services/indexer/requirements.txt -r services/staleness-monitor/requirements.txt
      - run: python -m compileall -q services load-generator tests
      - run: python -m unittest tests.unit.test_event_pipeline tests.unit.test_load_generator -v
