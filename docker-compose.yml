name: freshindex

x-python-service: &python-service
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  networks: [pipeline]

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      CDC_DB_USER: ${CDC_DB_USER:-cdc_reader}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:?set CDC_DB_PASSWORD in .env}
      WRITER_DB_USER: ${WRITER_DB_USER:-catalog_writer}
      WRITER_DB_PASSWORD: ${WRITER_DB_PASSWORD:?set WRITER_DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - track_commit_timestamp=on
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [pipeline]

  redis:
    image: redis:7.4.0-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [pipeline]

  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep -q 'available'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [pipeline]

  cdc-reader:
    <<: *python-service
    build:
      context: .
      dockerfile: services/replication-consumer/Dockerfile
    environment:
      DATABASE_URL: postgresql://${CDC_DB_USER:-cdc_reader}:${CDC_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-catalog}
      CDC_SLOT: cdc_products_slot
      CDC_PUBLICATION: cdc_pub
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CDC_STREAM: cdc_events
      PORT: 8082
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  indexer:
    <<: *python-service
    build:
      context: .
      dockerfile: services/indexer/Dockerfile
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CDC_STREAM: cdc_events
      CDC_DLQ_STREAM: cdc_events_dlq
      CDC_MAX_ATTEMPTS: ${CDC_MAX_ATTEMPTS:-5}
      CDC_CLAIM_IDLE_MS: ${CDC_CLAIM_IDLE_MS:-30000}
      CDC_KEY_LOCK_SECONDS: ${CDC_KEY_LOCK_SECONDS:-120}
      INDEXER_PROCESSING_DELAY_MS: ${INDEXER_PROCESSING_DELAY_MS:-0}
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-50}
      INDEXER_WORKERS: ${INDEXER_WORKERS:-4}
      VISIBILITY_MARKER_RETENTION_SECONDS: ${VISIBILITY_MARKER_RETENTION_SECONDS:-604800}
      VISIBILITY_MARKER_CLEANUP_SECONDS: ${VISIBILITY_MARKER_CLEANUP_SECONDS:-3600}
      REDIS_CONSUMER_GROUP: indexers
      MEILISEARCH_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_INDEX: products
      MEILI_VISIBILITY_INDEX: cdc_visibility
      PORT: 8081
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  monitor:
    <<: *python-service
    build:
      context: .
      dockerfile: services/staleness-monitor/Dockerfile
    environment:
      DATABASE_URL: postgresql://${CDC_DB_USER:-cdc_reader}:${CDC_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-catalog}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_VISIBILITY_INDEX: cdc_visibility
      STALENESS_SLOT: staleness_monitor_slot
      STALENESS_SLO_MS: ${STALENESS_SLO_MS:-1000}
      STALENESS_POLL_SECONDS: ${STALENESS_POLL_SECONDS:-0.12}
      SAMPLE_WINDOW: ${SAMPLE_WINDOW:-10000}
      PORT: 8080
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  loadgen:
    build:
      context: .
      dockerfile: load-generator/Dockerfile
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql://${WRITER_DB_USER:-catalog_writer}:${WRITER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-catalog}
      LOADGEN_RATE: ${LOADGEN_RATE:-5}
      LOADGEN_DURATION_SECONDS: ${LOADGEN_DURATION_SECONDS:-60}
      LOADGEN_SEED: ${LOADGEN_SEED:-2026}
    depends_on:
      postgres:
        condition: service_healthy
      cdc-reader:
        condition: service_healthy
      indexer:
        condition: service_healthy
      monitor:
        condition: service_healthy
    profiles: [workload]
    networks: [pipeline]

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:

networks:
  pipeline:
    driver: bridge
